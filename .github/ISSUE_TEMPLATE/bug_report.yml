name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in VeriFace
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of VeriFace is affected?
      options:
        - Frontend (Dashboard/UI)
        - Backend (API)
        - Deepfake Detection
        - Text Detection
        - Account Verification
        - Trust Score Engine
        - Docker/Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS: [e.g., Windows 11, Ubuntu 22.04]
        - Browser: [e.g., Chrome 120]
        - Python: [e.g., 3.11]
        - Node: [e.g., 20.x]
      render: markdown
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add any screenshots or error logs.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low - Minor issue
        - Medium - Affects functionality
        - High - Blocks usage
        - Critical - Security or data issue
    validations:
      required: true
