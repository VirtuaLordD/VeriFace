name: "✨ Feature Request"
description: Suggest a new feature or enhancement for VeriFace
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        We'd love to hear your ideas! Please describe the feature below.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of VeriFace would this feature affect?
      options:
        - Frontend (Dashboard/UI)
        - Backend (API)
        - Deepfake Detection
        - Text Detection
        - Account Verification
        - Trust Score Engine
        - Docker/Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "I'm frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've considered?
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical for launch
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or references.
